[project]
name = "wica"
version = "0.1.0"
description = "Agentic framework centered on a World store of multimodal context, rendered to LLM-facing prompts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "opentelemetry-api>=1.20",
]

# Provider integrations are optional extras: core `wica` ships with no model provider,
# and a consumer installs only what it wires up (e.g. `wica[openai] @ git+https://...`).
# Selecting a provider whose extra isn't installed fails at runtime with a clear
# ImportError. See specs/project.md ("Provider integrations are optional extras").
[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
huggingface-hub = ["langchain-huggingface>=1.2"]
# Gemini via the Gemini Developer API and Mistral via La Plateforme (`provider: "gemini"` /
# `"mistral"`, plain init_chat_model pass-throughs under LangChain's ids). Old extras
# `google-genai`/`mistralai` were removed with no alias (specs/config.md, "Provider names").
gemini = ["langchain-google-genai>=4.4"]
mistral = ["langchain-mistralai>=1.1"]
# Every provider speaking an OpenAI protocol (today `openai-chat-completions-compatible`, any
# server implementing Chat Completions: llama-server, mlx_lm.server, Ollama, vLLM, ...). Named
# after the protocol family, shared by all such providers; the vendor extra `openai` stays apart.
openai-compatible = ["langchain-openai>=1.0"]
# Not a provider: the opt-in Gradio observability panels in `wica.contrib.gradio`
# (specs/gradio-contrib.md, "Packaging"). Core never imports Gradio.
gradio = ["gradio>=5.0.0"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

# The dev/demo groups list every provider package so this repo's own e2e tests and demo
# can switch providers by editing config alone (extras serve downstream consumers, groups
# serve in-repo work — see specs/project.md).
[dependency-groups]
dev = [
    # The contrib imports Gradio at module top; pyright (which includes `src`) and the fast
    # test tier (`tests/contrib/`) need it installed.
    "gradio>=5.0.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-huggingface>=1.2",
    "langchain-google-genai>=4.4",
    "langchain-mistralai>=1.1",
    "pyright>=1.1.411",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    # Span tests use the SDK's in-memory exporter (see tests/conftest.py); wica itself never
    # imports the SDK.
    "opentelemetry-sdk>=1.20",
    # Runs the fast tier in parallel (`addopts` below).
    "pytest-xdist>=3.8.0",
    # The setup contract's conformance check (`module_setup.contract.check_contract`) in
    # tests/test_setup.py; never a runtime dependency (specs/setup.md).
    "module-setup",
]
# The runnable example only (examples/conversation_demo/app.py); kept out of core deps.
# Run with: uv run --group demo python -m examples.conversation_demo.app
demo = [
    "gradio>=5.0.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-huggingface>=1.2",
    "langchain-google-genai>=4.4",
    "langchain-mistralai>=1.1",
    # For the opt-in WICA_DEMO_TRACES=console exporter.
    "opentelemetry-sdk>=1.20",
]

[tool.uv.sources]
# On module-setup's `base-dir` branch until its PR #7 (the contract's `base_dir`) is merged: go back
# to `rev = "main"` then.
module-setup = { git = "https://github.com/funwithagents/module-setup", rev = "base-dir" }

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so tests can import the `examples` package (the runnable demo);
# `wica` itself resolves via the installed editable package, not this.
pythonpath = ["."]
# The fast tier runs in parallel (pytest-xdist), as reachy-mini-bridge's and naoqi-sim's: it is
# sleep-bound (coalescing windows, step loops and `wait_until` deadlines run in real time) more
# than compute-bound. Capped at eight: each worker is a whole interpreter. `logical` counts
# logical cores, as `auto` may count physical ones. `-n 0` runs it serially.
# tests-e2e/conftest.py forces that tier serial. See specs/testing.md ("Tooling").
addopts = ["-n", "logical", "--maxprocesses", "8"]

[tool.pyright]
include = ["src", "tests", "tests-e2e", "benchmarks"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
